name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pizza_user
          POSTGRES_PASSWORD: pizza_password
          POSTGRES_DB: pizza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pizza_user -d pizza_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: 0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      TG_URL: https://t.me/example
      GITHUB_URL: https://github.com/example/repository
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pizza_user
      DB_PASSWORD: pizza_password
      DB_NAME: pizza_db
      DEBUG: "false"
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m unittest discover -v

      - name: Compile application
        run: python -m compileall -q .

  deploy:
    name: Deploy to production
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    concurrency:
      group: pizzaforge-production
      cancel-in-progress: false

    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy PizzaForge
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/deploy-pizzaforge"